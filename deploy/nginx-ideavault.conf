# Matches the pre-certbot shape of sift.app-me.online / muse.app-me.online
# (see /home/mephisto/NGINX.md). Once DNS for ideavault.app-me.online points
# at this box, run: sudo certbot --nginx -d ideavault.app-me.online
# — certbot rewrites this file in place to add the HTTPS block + redirect.

server {
    server_name ideavault.app-me.online;

    # Requests carry the auth token as ?token=... (needed for clients with no
    # custom-header option) — never write that to a log file.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streamable HTTP can hold the connection open for SSE responses
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ideavault.app-me.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ideavault.app-me.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = ideavault.app-me.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name ideavault.app-me.online;

    access_log off;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}
